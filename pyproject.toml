[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-review-system"
version = "0.2.1"
description = "Evidence-first review runtime for arbitrary user-provided documents"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pypdf>=6.18.1,<7",
  "pypdfium2>=5.12.1,<6",
  "Pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "setuptools>=77.0.3",
]

[project.scripts]
evidence-review = "evidence_review.cli:main"
ansim-review = "evidence_review.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidence_review.evidence" = ["schema.sql", "schema_v2.sql", "schema_v3.sql"]
"evidence_review.review_matter" = ["schema.sql"]
"evidence_review.llm_layer" = ["templates/*.md"]
"evidence_review.review_packet" = ["assets/*.css", "assets/*.js"]
"evidence_review.drawing_review" = ["assets/*.css", "assets/*.js"]
"evidence_review.workbench" = ["assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["scripts/validate_workspace.py", ".pytest-work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/evidence_review"]
