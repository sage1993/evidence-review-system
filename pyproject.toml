[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-review-system"
version = "0.2.0"
description = "Evidence-first review runtime for arbitrary user-provided documents"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pypdf>=5,<6",
  "pypdfium2>=5.12,<6",
  "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
evidence-review = "evidence_review.cli:main"
ansim-review = "evidence_review.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidence_review.evidence" = ["schema.sql", "schema_v2.sql"]
"evidence_review.llm_layer" = ["templates/*.md"]
"evidence_review.review_packet" = ["assets/*.css", "assets/*.js"]
"evidence_review.drawing_review" = ["assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["scripts/validate_workspace.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/evidence_review"]
