name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -v
      - run: ruff check src tests --fix --diff
      - run: mypy src
      - run: python -m compileall -q src scripts web_runtime tests
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel in isolated environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
      - name: Verify canonical wheel resources and entrypoints
        run: |
          .wheel-venv/bin/python - <<'PY'
          from importlib.resources import files

          import ansim_review.contracts.source_batch as legacy
          import evidence_review.contracts.source_batch as canonical

          assert canonical is legacy
          assert canonical.SourceBatch is legacy.SourceBatch

          schema = files("evidence_review.evidence").joinpath("schema.sql")
          assert schema.is_file(), schema

          templates = files("evidence_review.llm_layer").joinpath("templates")
          assert templates.is_dir(), templates
          assert any(item.name.endswith(".md") for item in templates.iterdir())

          assets = files("evidence_review.review_packet").joinpath("assets")
          assert assets.is_dir(), assets
          assert any(item.name.endswith(".css") for item in assets.iterdir())
          PY
          .wheel-venv/bin/evidence-review --help
          .wheel-venv/bin/ansim-review --help
          .wheel-venv/bin/python -m evidence_review --help
          .wheel-venv/bin/python -m ansim_review --help

  wheel-python313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python -m venv .wheel-venv
      - run: .wheel-venv/bin/python -m pip install dist/*.whl
      - name: Verify canonical resources on Python 3.13
        run: |
          .wheel-venv/bin/python - <<'PY'
          from importlib.resources import files

          import ansim_review.contracts.source_batch as legacy
          import evidence_review.contracts.source_batch as canonical

          assert canonical is legacy
          assert canonical.SourceBatch is legacy.SourceBatch
          assert files("evidence_review.evidence").joinpath("schema.sql").is_file()
          assert any(
              item.name.endswith(".md")
              for item in files("evidence_review.llm_layer")
              .joinpath("templates")
              .iterdir()
          )
          assert any(
              item.name.endswith(".css")
              for item in files("evidence_review.review_packet")
              .joinpath("assets")
              .iterdir()
          )
          PY
          .wheel-venv/bin/evidence-review --help
          .wheel-venv/bin/ansim-review --help
          .wheel-venv/bin/python -m evidence_review --help
          .wheel-venv/bin/python -m ansim_review --help

  workspace-validator-platforms:
    name: Workspace validator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -v tests/integration/test_workspace_validator.py
