name: PR4 Verification

on:
  push:
    branches:
      - fix/stab-pr4-filesystem-trust

permissions:
  contents: read

jobs:
  linux-merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Focused filesystem and viewer tests
        run: >-
          python -m pytest -q -ra
          tests/unit/test_filesystem_trust.py
          tests/unit/test_active_workspace_binding.py
          tests/unit/review_packet/test_page_image_verifier_authority.py
          tests/unit/review_packet/test_case_visual_projection.py
          tests/unit/review_packet/test_case_visual_asset_server.py
          tests/unit/review_packet/test_reference_page_projection.py
          tests/integration/review_packet/test_protected_image_delivery.py
      - name: Review packet subsystem
        run: python -m pytest -q tests/unit/review_packet tests/integration/review_packet
      - name: Full suite
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy Windows target
        run: python -m mypy --platform win32 src/evidence_review
      - name: Diff check
        run: git diff --check

  windows-filesystem-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Windows symlink junction reparse acceptance
        run: >-
          python -m pytest -q -ra
          tests/unit/test_filesystem_trust.py
          tests/unit/test_active_workspace_binding.py
          tests/unit/review_packet/test_page_image_verifier_authority.py
          tests/unit/review_packet/test_case_visual_projection.py
          tests/unit/review_packet/test_case_visual_asset_server.py
          tests/integration/review_packet/test_protected_image_delivery.py
      - name: Mypy native Windows
        run: python -m mypy src/evidence_review
      - name: Diff check
        run: git diff --check
