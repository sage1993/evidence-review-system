name: Agent Case Visual Validation

on:
  push:
    branches:
      - agent/case-visual-review-ci

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused case visual tests
        run: >-
          python -m pytest -q
          tests/unit/drawing_review/test_visual_handoff.py
          tests/unit/drawing_review/test_visual_submission.py
          tests/unit/review_packet/test_case_visual_projection.py
          tests/unit/review_packet/test_case_visual_renderer.py
          tests/unit/llm_layer/test_track_a_issue_relevance.py
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/evidence_review
      - name: Compileall
        run: python -m compileall -q src/evidence_review
