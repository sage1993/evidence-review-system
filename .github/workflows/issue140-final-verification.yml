name: issue140-final-verification

on:
  push:
    branches:
      - fix/issue-140-spdx-license-metadata-v2

permissions:
  contents: read

jobs:
  packaging-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact minimum build backend and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==77.0.3" wheel build
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import setuptools
          assert setuptools.__version__ == "77.0.3", setuptools.__version__
          PY
      - name: Focused packaging policy
        run: python -m pytest -q tests/integration/packaging/test_python_support_policy.py
      - name: Build sdist and wheel at minimum setuptools floor
        shell: bash
        run: |
          set -o pipefail
          rm -rf dist build *.egg-info src/*.egg-info
          python -m build --no-isolation --sdist --wheel 2>&1 | tee issue140-build.log
          if grep -Eiq "project\.license.*deprecated|License ::.*deprecated|license metadata.*deprecat" issue140-build.log; then
            echo "Deprecated license metadata warning detected"
            exit 1
          fi
      - name: Verify distribution license metadata and LICENSE inclusion
        run: |
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(archive.read(metadata_name).decode("utf-8"))
              assert metadata["License-Expression"] == "Apache-2.0"
              assert "LICENSE" in (metadata.get_all("License-File") or [])
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)

          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/LICENSE") for name in names)
          PY
      - name: Verify installed wheel metadata
        shell: bash
        run: |
          python -m venv .issue140-wheel-venv
          .issue140-wheel-venv/bin/python -m pip install --upgrade pip
          .issue140-wheel-venv/bin/python -m pip install dist/*.whl
          .issue140-wheel-venv/bin/python - <<'PY'
          from importlib.metadata import metadata

          package = metadata("evidence-review-system")
          assert package["License-Expression"] == "Apache-2.0"
          assert "LICENSE" in (package.get_all("License-File") or [])
          PY
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests web_runtime
      - name: mypy Linux
        run: python -m mypy src
      - name: mypy Win32 model
        run: python -m mypy --platform win32 src
      - name: Compileall
        run: python -m compileall -q src scripts web_runtime tests
      - name: Documentation integrity
        run: python -m evidence_review documentation validate --repository-root . --config documentation-integrity.json --output issue140-doc-integrity.json
      - name: Diff check
        run: git diff --check origin/main...HEAD

  full-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Focused packaging policy
        run: python -m pytest -q tests/integration/packaging/test_python_support_policy.py
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests web_runtime
      - name: mypy native
        run: python -m mypy src
      - name: Compileall
        run: python -m compileall -q src scripts web_runtime tests
      - name: Documentation integrity
        run: python -m evidence_review documentation validate --repository-root . --config documentation-integrity.json --output issue140-doc-integrity.json
      - name: Diff check
        run: git diff --check origin/main...HEAD
