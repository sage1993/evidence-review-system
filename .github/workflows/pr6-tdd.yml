name: PR6 Manifest TDD

on:
  push:
    branches:
      - fix/stab-pr6-release-completeness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Manifest completeness and producer symmetry
        run: |
          python -m pytest -q \
            tests/integration/packaging/test_runtime_manifest_completeness.py \
            tests/integration/packaging/test_runtime_manifest_inventory.py \
            tests/integration/packaging/test_web_bundle.py
