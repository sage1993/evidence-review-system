name: PR6 README Contract Fix

on:
  push:
    branches:
      - fix/stab-pr6-release-completeness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-readme:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stab-pr6-release-completeness
      - name: Apply exact dependency contract replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          old = 'Runtime dependencies are pinned to pypdf>=5,<6, pypdfium2>=5.12,<6, and Pillow>=12,<13.'
          new = 'Runtime dependencies are pinned to pypdf>=6.17,<7, pypdfium2>=5.12,<6, and Pillow>=12,<13.'
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old dependency line, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs(deps): align README with pypdf support floor [skip ci]'
          git push origin HEAD:fix/stab-pr6-release-completeness
