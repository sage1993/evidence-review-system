name: PR6 TDD Gate

on:
  push:
    branches:
      - fix/stab-pr6-release-completeness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Task 6.1 focused tests
        run: python -m pytest -q tests/unit/review_packet/test_decision_record.py tests/unit/review_packet/test_decision_state.py tests/integration/review_packet/test_persisted_decision_ui.py
