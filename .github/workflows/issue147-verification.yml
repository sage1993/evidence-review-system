name: issue147-verification

on:
  push:
    branches:
      - fix/issue-147-cross-platform-baseline-tests

permissions:
  contents: read

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Focused baseline defects
        run: python -m pytest -q tests/unit/review_packet/test_browser_launcher.py::test_server_status_retries_transient_windows_identity_query tests/unit/test_validate_workspace_entrypoints.py::test_explicit_legacy_validator_keeps_ansim_grist_contract
      - name: Full pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests web_runtime
      - name: mypy native
        run: python -m mypy src
      - name: mypy Win32 model
        if: runner.os == 'Linux'
        run: python -m mypy --platform win32 src
      - name: Compileall
        run: python -m compileall -q src scripts web_runtime tests
      - name: Documentation integrity
        run: python -m evidence_review documentation validate --repository-root . --config documentation-integrity.json --output issue147-doc-integrity.json
      - name: Diff check
        run: git diff --check origin/main...HEAD
